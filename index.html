<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kobold Cave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one lantern-lit screen in three columns. The party panel on the
   left, the battle in the middle (picture, then choices, then the log with
   the newest turn on top), and field notes on the right. Narrower screens
   turn the side panels into drawers. Deliberately dark only, it's a cave. */
:root {
  --rock: #1b1714;        /* page */
  --rock-raised: #26201b; /* tray, buttons */
  --seam: #3a3029;        /* borders, dividers */
  --dust: #d9cbb6;        /* running text */
  --dust-dim: #9a8b78;    /* secondary text */
  --lantern: #f0a73c;     /* accent: prompts, focus, choices */
  --copper: #d7774a;      /* loot names */
  --blood: #e0625a;       /* damage, death */
  --gold: #f4d27a;        /* victory */
  --hp: #4f9a45;          /* hero health */
  --hp-hi: #7cc66c;
  --mana: #6aa2ff;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse 90% 60% at 50% 0%, #2b221b 0%, var(--rock) 70%) var(--rock);
  color: var(--dust);
  font: 16px/1.55 var(--font-body);
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 17rem minmax(0, 46rem) 17rem;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head head" "party main info";
  column-gap: 1.5rem;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
header { grid-area: head; }
main { grid-area: main; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#party-panel { grid-area: party; }
#info-panel { grid-area: info; }
.panel {
  min-height: 0;
  overflow-y: auto;
  /* Give the scrollbar its own lane so it never sits on top of the text. */
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: var(--seam) transparent;
  padding-inline-end: 0.6rem;
  padding-block: 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}
.panel-title {
  margin: 0;
  font: 400 1.25rem/1 var(--font-display);
  color: var(--lantern);
}
/* Each section is a card with its own accent, so they're easy to tell
   apart at a glance and the order they've been dragged into is clear. */
.panel-section {
  --accent: var(--dust-dim);
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  padding: 0.55rem 0.7rem 0.7rem;
  background: rgba(255, 236, 210, 0.035);
  border: 1px solid var(--seam);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
}
.panel-section[data-key="stats"] { --accent: var(--hp-hi); }
.panel-section[data-key="gear"], .panel-section[data-key="supplies"] { --accent: var(--copper); }
.panel-section[data-key="skills"] { --accent: var(--mana); }
.panel-section[data-key="boons"], .panel-section[data-key="trophies"] { --accent: var(--gold); }
.panel-section[data-key="enemy"] { --accent: var(--blood); }
.panel-section[data-key="journey"] { --accent: var(--lantern); }
.panel-section h2 {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  border-bottom: 1px solid var(--seam);
  padding-bottom: 0.3rem;
}
/* Sections can be dragged by their heading or moved with its arrows (panels.js). */
.panel-section h2 { display: flex; align-items: center; gap: 0.4rem; cursor: grab; }
.panel-section h2 .section-title { flex: 1; min-width: 0; }
.reorder { display: flex; gap: 0.15rem; opacity: 0.35; transition: opacity 0.15s; }
.panel-section:hover .reorder, .reorder:focus-within { opacity: 1; }
@media (hover: none) { .reorder { opacity: 1; } }
button.reorder-button {
  padding: 0.1rem 0.3rem;
  font-size: 0.6rem;
  line-height: 1;
  color: var(--dust-dim);
}
button.reorder-button:disabled { visibility: hidden; }
.panel-section.dragging { opacity: 0.4; }
.panel-section.drop-before { box-shadow: 0 -3px 0 var(--lantern); }
.panel-section.drop-after { box-shadow: 0 3px 0 var(--lantern); }
.tabs { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.tab { padding: 0.4rem 0.6rem; font-size: 0.85rem; }
.tab[aria-selected="true"] { border-color: var(--lantern); color: var(--lantern); }
.tab.acting::after { content: "•"; color: var(--lantern); margin-left: 0.3rem; }
.tab.down { text-decoration: line-through; color: var(--dust-dim); }
.member { display: flex; flex-direction: column; gap: 0.9rem; }
.member-head { display: flex; gap: 0.6rem; align-items: center; }
.portrait.small { width: 3rem; height: 3rem; padding: 0.2rem; }
.fallen-note { margin: 0; color: var(--blood); font-size: 0.85rem; }
dl.stats {
  margin: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.15rem 0.75rem;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
}
dl.stats dt { color: var(--dust-dim); }
dl.stats dd { margin: 0; text-align: right; }
ul.gear, ul.skills, ol.journey { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.45rem; }
ul.gear li { display: grid; grid-template-columns: 5.2rem 1fr; gap: 0 0.5rem; font-size: 0.85rem; }
ul.gear li .what { grid-column: 2; font-size: 0.75rem; }
ul.gear .slot { color: var(--dust-dim); }
.gear-top { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: baseline; justify-content: space-between; }
button.equip { padding: 0.2rem 0.45rem; font-size: 0.72rem; }
button.equip[aria-expanded="true"] { border-color: var(--lantern); color: var(--lantern); }
.equip-options { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.3rem; }
button.equip-option {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.1rem;
  padding: 0.4rem 0.55rem;
  font-weight: 400;
  text-align: left;
  line-height: 1.3;
}
button.equip-option .what { font-size: 0.72rem; }
ul.gear .item { color: var(--copper); font-weight: 700; }
ul.gear .forged { color: var(--lantern); }
ul.gear .empty, ul.gear li.empty { color: var(--dust-dim); font-style: italic; }
#info-panel ul.gear li { grid-template-columns: 1fr; }
#info-panel ul.gear li .what { grid-column: 1; }
.skill { font-size: 0.85rem; display: flex; flex-direction: column; gap: 0.1rem; }
.skill .what { font-size: 0.75rem; line-height: 1.35; }
.skill-top { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: baseline; }
.skill-name { font-weight: 700; }
.skill.boon .skill-name { color: var(--gold); }
.skill.signature .skill-name { color: var(--lantern); }
.tag {
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.05rem 0.3rem;
  border-radius: 2px;
  background: var(--seam);
  color: var(--dust);
}
.tag.waiting { background: transparent; box-shadow: inset 0 0 0 1px var(--seam); color: var(--dust-dim); }
.tag.warning { background: var(--blood); color: var(--rock); }
ol.journey li { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.85rem; padding-left: 0.6rem; border-left: 2px solid var(--seam); }
ol.journey li.done { color: var(--dust-dim); }
ol.journey li.done .skill-name { text-decoration: line-through; }
ol.journey li.here { border-left-color: var(--lantern); }
ol.journey li .what { font-size: 0.75rem; }
.drawer-toggle { display: none; padding: 0.4rem 0.7rem; font-size: 0.8rem; }
.header-tools { display: flex; gap: 0.4rem; align-items: baseline; flex-wrap: wrap; }
#backdrop { display: none; }
/* Medium screens: the field notes become a drawer on the right. */
@media (max-width: 75rem) {
  .app {
    grid-template-columns: 16rem minmax(0, 1fr);
    grid-template-areas: "head head" "party main";
  }
  #info-panel { position: fixed; inset: 0 0 0 auto; transform: translateX(105%); }
  #toggle-info { display: inline-flex; }
}
/* Narrow screens: the party panel becomes a drawer on the left too. */
@media (max-width: 52rem) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "main"; }
  #party-panel { position: fixed; inset: 0 auto 0 0; transform: translateX(-105%); }
  #toggle-party { display: inline-flex; }
}
@media (max-width: 75rem) {
  #party-panel.drawer-open, #info-panel.drawer-open { transform: none; }
  #info-panel, #party-panel {
    width: min(20rem, 88vw);
    box-sizing: border-box;
    padding-inline: 1rem;
    background: var(--rock-raised);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    z-index: 30;
    transition: transform 0.2s ease-out;
  }
  #backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 25; }
}
@media (min-width: 52.01rem) {
  #party-panel { position: static; transform: none; width: auto; background: none; box-shadow: none; padding-inline: 0 0.6rem; }
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  padding-block: 1.25rem 0.75rem;
  border-bottom: 1px solid var(--seam);
}
h1 {
  margin: 0;
  font: 400 2.1rem/1 var(--font-display);
  color: var(--lantern);
  letter-spacing: 0.02em;
  text-shadow: 0 0 18px rgba(240, 167, 60, 0.35);
}
.depth {
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dust-dim);
}
#log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 0.5rem calc(1rem + env(safe-area-inset-bottom, 0px));
  overflow-wrap: anywhere;
}
/* The log is a stack of turns, newest on top. Each turn reads top to bottom. */
#log .turn { padding-block: 0.6rem; border-bottom: 1px dashed var(--seam); }
#log .turn:first-child { border-bottom-style: solid; }
#log .turn + .turn { opacity: 0.68; }
#log p { margin: 0; min-height: 1.55em; white-space: pre-wrap; }
#log .stat { color: var(--dust-dim); font-variant-numeric: tabular-nums; }
#log .encounter { color: var(--lantern); font-weight: 700; margin-top: 0.4rem; }
#log .hurt { color: var(--blood); }
#log .death { color: var(--blood); font-weight: 700; font-size: 1.15rem; }
#log .victory { color: var(--gold); font-weight: 700; }
#log .loot { color: var(--copper); font-weight: 700; }
#log .prompt { color: var(--lantern); }
#log .answer { color: var(--dust-dim); }
#log .answer::before { content: "> "; color: var(--lantern); }
#log .divider {
  min-height: 0;
  height: 1px;
  margin-block: 0.75rem;
  background: linear-gradient(90deg, transparent, var(--seam) 15%, var(--seam) 85%, transparent);
  color: transparent;
  overflow: hidden;
}
#log .system { color: var(--dust-dim); font-style: italic; }
#log .chapter { color: var(--gold); font: 400 1.2rem/1.3 var(--font-display); margin-bottom: 0.3rem; }
#log .chapter.fight { color: var(--blood); }
/* --- Hall of legends (hall.js) --- */
#hall-dialog {
  width: min(36rem, calc(100vw - 32px));
  max-height: calc(100dvh - 32px);
  box-sizing: border-box;
  padding: 1.25rem 1.5rem;
  color: var(--dust);
  background: var(--rock-raised);
  border: 1px solid var(--gold);
  border-radius: 4px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(244, 210, 122, 0.15);
}
#hall-dialog[open] { display: flex; flex-direction: column; gap: 0.75rem; }
#hall-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
.hall-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.hall-head h2 { margin: 0; font: 400 1.6rem/1.15 var(--font-display); color: var(--gold); }
button.hall-close { padding: 0.4rem 0.7rem; font-size: 0.8rem; }
dl.hall-totals { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
dl.hall-totals div { padding: 0.45rem 0.55rem; border: 1px solid var(--seam); border-radius: 3px; }
dl.hall-totals dt { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dust-dim); }
dl.hall-totals dd { margin: 0; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
ol.hall-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
li.hall-run {
  display: grid;
  grid-template-columns: 1.8rem minmax(0, 1fr) auto;
  gap: 0.6rem;
  align-items: baseline;
  padding: 0.55rem 0.3rem;
  border-bottom: 1px dashed var(--seam);
}
li.hall-run.latest { background: rgba(240, 167, 60, 0.08); }
.hall-rank { color: var(--dust-dim); font-variant-numeric: tabular-nums; text-align: right; }
.hall-body { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.hall-top { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: baseline; }
.hall-outcome { font-size: 0.85rem; color: var(--blood); }
li.hall-run.won .hall-outcome { color: var(--gold); font-weight: 700; }
.hall-grade { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
.hall-score { font: 400 1.35rem/1 var(--font-display); color: var(--dust); font-variant-numeric: tabular-nums; }
.hall-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.25rem; }
.hall-small {
  font: 700 0.72rem/1 var(--font-body);
  padding: 0.3rem 0.5rem;
  color: var(--dust);
  background: var(--rock-raised);
  border: 1px solid var(--seam);
  border-radius: 3px;
  text-decoration: none;
  cursor: pointer;
}
a.hall-small:hover { border-color: var(--lantern); color: var(--lantern); }
dl.hall-parts {
  margin: 0.4rem 0 0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.1rem 1rem;
  max-width: 16rem;
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
}
dl.hall-parts dt { color: var(--dust-dim); }
dl.hall-parts dd { margin: 0; text-align: right; }
.hall-tiers { margin: 0; display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; font-size: 0.72rem; color: var(--dust-dim); }
/* Tier badges, from Bronze up to Legend. */
.tier {
  display: inline-block;
  padding: 0.1rem 0.4rem;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 2px;
  border: 1px solid currentColor;
}
.tier.bronze { color: #c98a55; }
.tier.silver { color: #c9ced6; }
.tier.gold { color: var(--gold); }
.tier.master { color: #7fc8ff; }
.tier.grandmaster { color: #c79bff; }
.tier.legend { color: var(--rock); background: linear-gradient(90deg, var(--gold), #ff9a6a); border-color: transparent; }
.hall-empty { padding: 1rem 0; color: var(--dust-dim); font-style: italic; }
.hall-note { margin: 0; font-size: 0.72rem; }
#open-hall { padding: 0.4rem 0.7rem; font-size: 0.8rem; }
@media (max-width: 34rem) {
  #hall-dialog { padding: 1rem 1.1rem; }
  dl.hall-totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* --- Spoils pop-up (showSpoils in scene.js) --- */
#spoils-dialog {
  width: min(24rem, calc(100vw - 32px));
  box-sizing: border-box;
  padding: 1.25rem 1.5rem;
  color: var(--dust);
  background: var(--rock-raised);
  border: 1px solid var(--lantern);
  border-radius: 4px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(240, 167, 60, 0.18);
}
#spoils-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
#spoils-dialog h2 { margin: 0; font: 400 1.5rem/1.15 var(--font-display); color: var(--gold); }
#spoils-dialog > .what { margin: 0.15rem 0 1rem; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem; }
ul.reward-list { list-style: none; margin: 0 0 1rem; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
ul.reward-list li {
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: 0.75rem;
  align-items: baseline;
  padding-bottom: 0.45rem;
  border-bottom: 1px dashed var(--seam);
}
ul.reward-list .label { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dust-dim); }
ul.reward-list .gain .value, ul.reward-list .gold .value { color: var(--gold); font-weight: 700; }
ul.reward-list .loot .value { color: var(--copper); font-weight: 700; }
#spoils-dialog .totals { margin: 0 0 1rem; font-size: 0.8rem; color: var(--dust-dim); font-variant-numeric: tabular-nums; }
#spoils-dialog .collect { width: 100%; justify-content: center; border-color: var(--lantern); color: var(--lantern); }
#spoils-dialog.boss { width: min(30rem, calc(100vw - 32px)); border-color: var(--gold); }
#spoils-dialog .verdict { margin: 0 0 1rem; font-style: italic; color: var(--dust); }
.stamps { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.8rem; }
.stamps:empty { display: none; }
.stamp {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 0.3rem 0.6rem;
  font: 400 1.05rem/1.1 var(--font-display);
  color: var(--gold);
  border: 2px solid currentColor;
  border-radius: 3px;
  transform: rotate(-4deg);
}
.stamp:nth-child(2) { transform: rotate(3deg); }
.stamp small { font: 700 0.7rem/1.2 var(--font-body); letter-spacing: 0.04em; }
.stamp.overkill { color: var(--blood); }
.stamp.swift { color: var(--mana); }
ul.reward-list .note { display: block; font-size: 0.75rem; font-weight: 400; color: var(--dust-dim); }
.xp-meter { display: flex; align-items: center; gap: 0.6rem; }
.xp-meter .bar.xp { flex: 1; height: 0.55rem; }
.xp-meter .bar i { transition: width 0.6s ease-out; }
.xp-tag { font-size: 0.75rem; color: var(--dust-dim); min-width: 4.5rem; text-align: right; }
.xp-meter.levelled .xp-tag { color: var(--gold); font-weight: 700; }
.count { font-variant-numeric: tabular-nums; }
/* The killing blow (celebrate in scene.js). */
#scene { position: relative; }
.victory-banner {
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  padding: 0.3rem 1.2rem;
  font: 400 2.2rem/1.1 var(--font-display);
  color: var(--gold);
  white-space: nowrap;
  text-shadow: 0 0 18px rgba(244, 210, 122, 0.6), 0 2px 0 var(--rock);
  background: radial-gradient(ellipse at center, rgba(27, 23, 20, 0.85) 30%, transparent 75%);
  pointer-events: none;
}
canvas.burst { position: fixed; pointer-events: none; z-index: 40; image-rendering: pixelated; }
.tray {
  border-bottom: 1px solid var(--seam);
  padding-block: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
#question { margin: 0; color: var(--lantern); font-weight: 700; }
.venue { display: flex; gap: 1rem; align-items: flex-start; }
.venue .portrait { width: 5rem; height: 5rem; }
.venue-notes { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.venue-heading { letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.3rem; }
ul.spoils { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.85rem; }
ul.spoils .gain { color: var(--gold); font-weight: 700; }
ul.spoils .loot { color: var(--copper); }
.gold, ul.spoils .gold { color: var(--gold); }
#log.revealing { cursor: pointer; }
#question:empty { display: none; }
#choices { display: flex; flex-wrap: wrap; gap: 0.5rem; }
#choices:empty { display: none; }
button {
  font: 700 0.95rem/1 var(--font-body);
  color: var(--dust);
  background: var(--rock-raised);
  border: 1px solid var(--seam);
  border-radius: 3px;
  padding: 0.65rem 0.9rem;
  cursor: pointer;
  display: inline-flex;
  gap: 0.5rem;
  align-items: baseline;
}
button:hover { border-color: var(--lantern); color: var(--lantern); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
button kbd { font: inherit; font-weight: 400; color: var(--dust-dim); font-size: 0.8rem; }
button:disabled { opacity: 0.45; cursor: default; border-color: var(--seam); color: var(--dust); }
form { display: flex; gap: 0.5rem; }
#answer {
  flex: 1;
  min-width: 0;
  font: 16px var(--font-body);
  color: var(--dust);
  background: var(--rock);
  border: 1px solid var(--seam);
  border-radius: 3px;
  padding: 0.6rem 0.75rem;
}
#answer::placeholder { color: var(--dust-dim); }

  .fallen .portrait { transition: filter 0.6s; }
  ul.reward-list li { animation: reward-in 0.3s ease-out backwards; }

  .stamp { animation: stamp-in 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
  @keyframes stamp-in { from { opacity: 0; transform: scale(2.2) rotate(-12deg); } }
  #spoils-dialog.shown li, #spoils-dialog.shown .stamp { animation: none; }
  .xp-meter.levelled .xp-tag { animation: flash 0.5s ease-out; }

<body>
<div class="app">
  <header>
    <h1>Kobold Cave</h1>
    <div class="header-tools">
      <span class="depth" id="status">Lighting the lantern…</span>
      <button class="drawer-toggle" id="toggle-party" type="button" aria-controls="party-panel">Party</button>
      <button class="drawer-toggle" id="toggle-info" type="button" aria-controls="info-panel">Notes</button>
      <button id="open-hall" type="button" aria-haspopup="dialog">Hall</button>
    </div>
  </header>
  <aside class="panel" id="party-panel" aria-label="Party"></aside>
  <main>
    <section id="scene" aria-label="Battle" hidden></section>
    <div class="tray">
      <p id="question" aria-live="polite"></p>
      <div id="choices"></div>
      <form id="input-form" autocomplete="off">
        <input id="answer" aria-label="Your answer" placeholder="Type your answer and press Enter" disabled>
        <button id="send" type="submit" disabled>Enter</button>
      </form>
    </div>
    <div id="log" aria-live="polite">
      <div class="turn"><p class="system">Loading Python in your browser. This takes a few seconds the first time.</p></div>
    </div>
  </main>
  <aside class="panel" id="info-panel" aria-label="Field notes"></aside>
  <div id="backdrop"></div>
</div>
<dialog id="spoils-dialog" aria-label="Spoils of battle"></dialog>
<dialog id="hall-dialog" aria-label="Hall of Legends"></dialog>

<script>
// GitHub Pages lets browsers reuse script files for ten minutes, but
// kobold_cave.py is always fetched fresh, so after an update the page could
// draw new game logic with old pictures. Load the page's own modules fresh
// as well, through an import map, so the two always match.
{
  const fresh = `?v=${Date.now()}`;
  const imports = Object.fromEntries(['scene.js', 'panels.js', 'hall.js', 'sprites.js'].map(name =>
    [new URL(name, location.href).href, new URL(name + fresh, location.href).href]));
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports });
  document.currentScript.after(map);
}
</script>
<script type="module">
import { showScene, showSpoils, celebrate, clearScene } from './scene.js';
import { drawPartyPanel, drawInfoPanel, clearPanels, onEquip, onCloseDrawer } from './panels.js';
import { addRun, showHall } from './hall.js';

// Pyodide is tried from a local copy first (see README), then the CDN.
const PYODIDE_SOURCES = ['./pyodide/', 'https://cdn.jsdelivr.net/npm/pyodide@314.0.7/'];

const log = document.getElementById('log');
const choices = document.getElementById('choices');
const form = document.getElementById('input-form');
const answer = document.getElementById('answer');
const send = document.getElementById('send');
const statusLabel = document.getElementById('status');
const question = document.getElementById('question');

function escapeHtml(text) {
  return text.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

function classify(line) {
  if (/^-{10,}$/.test(line)) return 'divider';
  if (/Brace yourselves!$/.test(line)) return 'warning';
  if (/GAME OVER|Kobolds slain/.test(line)) return 'death';
  if (/actually made it out|collapses onto his pile/.test(line)) return 'victory';
  if (/^You have encountered|blocks your path\. What will you do/.test(line)) return 'encounter';
  if (/You are struck|CRITICAL FAIL|blow to the head|^[\w' ]+ has fallen\.$|You collapse/.test(line)) return 'hurt';
  if (/is stunned|loses its turn|Boon Ability|refuse|refuses to fall|reaches? level/.test(line)) return 'victory';
  if (/^\s*([\w' ]+ HP|Mana): -?\d+(\/\d+)?$/.test(line)) return 'panel';  // drawn in the panel instead
  if (/^Creep Score:/.test(line)) return 'stat';
  return '';
}

// Each answer starts a new turn block at the top of the log; what follows
// is added to it in reading order, so the newest turn is always on top.
let turn = null;
function newTurn() {
  turn = document.createElement('div');
  turn.className = 'turn';
  log.prepend(turn);
  log.scrollTop = 0;
}

function addLine(text, cls = classify(text)) {
  if (cls === 'panel' && !document.getElementById('scene').hidden) return;
  if (!turn) newTurn();
  // The game prints a blank line after each answer; at the top of a turn it's just a gap.
  if (!text && turn.lastElementChild?.matches('.answer, .chapter')) return;
  const p = document.createElement('p');
  p.className = `${cls} new`.trim();
  // Item names are printed in [brackets]; give them the loot colour.
  p.innerHTML = escapeHtml(text).replace(/\[([^\]/]+)\]/g, '<span class="loot">[$1]</span>');
  turn.append(p);
  log.scrollTop = 0;
}

// Pacing: lines, picture updates and the next question all go through one
// queue, so text arrives a line at a time and the picture keeps in step.
// Clicking the log or pressing a key shows the rest at once.
const LINE_DELAY = 170;  // milliseconds between lines
const steps = [];
let revealing = false;
let skipping = false;  // stays on until the next question, so the whole turn shows
let lastLineAt = 0;

function enqueue(run, paced = false) {
  steps.push({ run, paced });
  if (!revealing) reveal();
}

async function reveal() {
  revealing = true;
  log.classList.add('revealing');
  while (steps.length) {
    // Python's lines trickle in one by one, so space them out by the time
    // since the last line was shown, not by whether more are waiting.
    const wait = lastLineAt + LINE_DELAY - performance.now();
    if (steps[0].paced && !skipping && wait > 0) {
      await new Promise(resolve => setTimeout(resolve, wait));
    }
    const step = steps.shift();
    await step.run();  // a step may wait, like the spoils pop-up
    if (step.paced) lastLineAt = performance.now();
  }
  revealing = false;
  log.classList.remove('revealing');
}

function skipAhead() {
  if (revealing) skipping = true;
}
log.addEventListener('click', skipAhead);

// Resolves once everything queued so far has been shown.
const settled = () => new Promise(resolve => enqueue(resolve));

// Python's print() arrives here byte by byte; split it into lines.
let pending = '';
const decoder = new TextDecoder();
function writeStdout(bytes) {
  pending += decoder.decode(bytes, { stream: true });
  const lines = pending.split('\n');
  pending = lines.pop();
  lines.forEach(line => enqueue(() => addLine(line), line.trim() !== ''));
  return bytes.length;
}

// Called from Python's input(). Shows the prompt, turns any [A / B / C]
// menu into buttons, and resolves with what the player picks or types.
let resolveAnswer = null;
// Called from kobold_cave.show() to update the picture panel.
window.drawScene = function (scene, json) {
  const details = JSON.parse(json);
  enqueue(() => {
    // The end of a run: into the hall of legends, and say where it placed.
    if (scene === 'record') {
      const { place, of } = addRun(details.run);
      const { grade, tier, parts } = details.run;
      addLine(`Grade: ${grade}, ${tier}. #${place} of ${of} in the Hall of Legends.`, 'victory');
      parts.forEach(([label, points]) => addLine(`  ${label} ${points > 0 ? '+' : ''}${points}`, 'stat'));
      addLine('Open the Hall to see it ranked, or Submit it to the shared leaderboard.', 'system');
      return;
    }
    // Fights start and end new blocks in the log, so each one stands apart.
    if (scene === 'encounter' || scene === 'aftermath') {
      newTurn();
      addLine(scene === 'encounter' ? details.enemy.name : `${details.enemy.name} defeated`,
              scene === 'encounter' ? 'chapter fight' : 'chapter');
    }
    // 'inventory' only refreshes the panels after an Equip; the battle panel stays.
    if (scene !== 'inventory') showScene(scene, details, { pick: submit });
    if (details.party) {
      drawPartyPanel(details);
      drawInfoPanel(details);
    }
    if (details.stage) statusLabel.textContent = `${details.stage} · Slain: ${details.cs}`;
    if (scene === 'aftermath') return celebrate(details.enemy);
    if (scene === 'spoils') return showSpoils(details.spoils, details);
  });
};

window.askPlayer = function (prompt) {
  return new Promise(resolve => enqueue(() => showQuestion(prompt, resolve)));
};

function showQuestion(prompt, resolve) {
  skipping = false;
  // When the game points at the party panel, light up its button (it's a drawer on phones).
  document.getElementById('toggle-party').classList.toggle('attention', /party panel/.test(prompt));
  const menu = prompt.match(/\[([^\]]+)\]\s*:?\s*$/);
  question.textContent = (menu ? prompt.slice(0, menu.index) : prompt).trim();

  choices.replaceChildren();
  if (menu) {
    menu[1].split(' / ').forEach((option, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.innerHTML = `${i < 9 ? `<kbd>${i + 1}</kbd>` : ''}${escapeHtml(option.trim())}`;
      button.addEventListener('click', () => submit(option.trim()));
      choices.append(button);
    });
  }
  answer.disabled = send.disabled = false;
  answer.placeholder = menu ? 'Or type your choice' : 'Type your answer and press Enter';
  if (!matchMedia('(pointer: coarse)').matches || !menu) answer.focus();
  resolveAnswer = resolve;
}

function submit(text) {
  if (!resolveAnswer) return;
  newTurn();
  if (question.textContent) addLine(question.textContent, 'prompt');
  question.textContent = '';
  addLine(text, 'answer');
  choices.replaceChildren();
  document.getElementById('toggle-party').classList.remove('attention');
  answer.value = '';
  answer.disabled = send.disabled = true;
  const resolve = resolveAnswer;
  resolveAnswer = null;
  resolve(text);
}

// An Equip button in the party panel answers the waiting question with a
// command; Python equips the item and asks the same question again.
onEquip((hero, slot, index) => {
  if (!resolveAnswer) return;
  const resolve = resolveAnswer;
  resolveAnswer = null;
  choices.replaceChildren();
  answer.disabled = send.disabled = true;
  resolve(['\x01equip', hero, slot, index].join('\x1f'));
});

form.addEventListener('submit', event => {
  event.preventDefault();
  submit(answer.value);
});

// Number keys pick a menu option while the text box is empty.
document.addEventListener('keydown', event => {
  if (document.querySelector('dialog[open]')) return;  // pop-ups handle their own keys
  if (revealing && !event.ctrlKey && !event.metaKey && !event.altKey) {
    skipAhead();
    return;
  }
  if (!resolveAnswer || answer.value || event.ctrlKey || event.metaKey || event.altKey) return;
  const index = Number(event.key) - 1;
  const button = choices.children[index];
  if (button) {
    event.preventDefault();
    button.click();
  }
});

async function loadRuntime() {
  let lastError;
  for (const base of PYODIDE_SOURCES) {
    try {
      const { loadPyodide } = await import(base + 'pyodide.mjs');
      return await loadPyodide({ indexURL: new URL(base, location.href).href });
    } catch (error) {
      console.warn(`Could not load Pyodide from ${base}`, error);
      lastError = error;
    }
  }
  throw lastError;
}

async function start() {
  if (!('Suspending' in WebAssembly)) {
    addLine('This browser cannot pause Python to wait for your answers. Open the game in Chrome 137 or newer.', 'death');
    statusLabel.textContent = 'Browser not supported';
    return;
  }

  let pyodide;
  try {
    pyodide = await loadRuntime();
    const source = await (await fetch('kobold_cave.py', { cache: 'no-cache' })).text();
    pyodide.FS.writeFile('/home/pyodide/kobold_cave.py', source);
  } catch (error) {
    addLine(`The game failed to load: ${error.message}`, 'death');
    addLine('If you opened index.html straight from disk, serve the folder instead (see README).', 'system');
    statusLabel.textContent = 'Failed to load';
    return;
  }
  pyodide.setStdout({ write: writeStdout });
  pyodide.setStderr({ write: writeStdout });

  log.replaceChildren();
  turn = null;
  clearPanels();
  statusLabel.textContent = 'At the entrance';
  // Swap input() for one that waits on the page. This must happen before
  // kobold_cave is imported, because its functions capture input as a default.
  await pyodide.runPythonAsync(`
import builtins, sys
import js
from pyodide.ffi import run_sync

def web_input(prompt=''):
    # The party panel's Equip buttons answer with a command instead of a
    # choice: carry it out, then ask the same question again.
    while True:
        sys.stdout.flush()
        answer = run_sync(js.askPlayer(prompt))
        if not answer.startswith('\\x01'):
            return answer
        kobold_cave.gear_command(kobold_cave.current_party, answer[1:])

builtins.input = web_input
sys.path.insert(0, '/home/pyodide')
import json
import kobold_cave

def web_show(scene, **details):
    js.drawScene(scene, json.dumps(details))
    return True

kobold_cave.show = web_show
`);

  while (true) {
    try {
      await pyodide.runPythonAsync('kobold_cave.main()\nsys.stdout.flush()');
    } catch (error) {
      addLine(String(error.message || error), 'death');
    }
    await settled();
    addLine('-'.repeat(20));
    await new Promise(resolve => {
      choices.replaceChildren();
      const again = document.createElement('button');
      again.type = 'button';
      again.innerHTML = '<kbd>1</kbd>Descend again';
      const hall = document.createElement('button');
      hall.type = 'button';
      hall.innerHTML = '<kbd>2</kbd>Hall of Legends';
      hall.addEventListener('click', () => showHall());
      again.addEventListener('click', () => {
        resolveAnswer = null;
        log.replaceChildren();
        turn = null;
        clearScene();
        clearPanels();
        statusLabel.textContent = 'At the entrance';
        resolve();
      });
      choices.append(again, hall);
      resolveAnswer = () => {};  // lets the number-key shortcut reach the button
      again.focus();
    });
  }
}

// On narrow screens the side panels are drawers, opened from the header.
const backdrop = document.getElementById('backdrop');
function closeDrawers() {
  document.querySelectorAll('.drawer-open').forEach(panel => panel.classList.remove('drawer-open'));
  backdrop.classList.remove('open');
}
for (const [buttonId, panelId] of [['toggle-party', 'party-panel'], ['toggle-info', 'info-panel']]) {
  document.getElementById(buttonId).addEventListener('click', () => {
    const panel = document.getElementById(panelId);
    const opening = !panel.classList.contains('drawer-open');
    closeDrawers();
    if (opening) {
      panel.classList.add('drawer-open');
      backdrop.classList.add('open');
    }
  });
}
backdrop.addEventListener('click', closeDrawers);
document.getElementById('open-hall').addEventListener('click', () => { closeDrawers(); showHall(); });
onCloseDrawer(closeDrawers);
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDrawers(); });

clearPanels();
start();
</script>
</body>
