name: Tests

on:
  # Pull requests are tested by the pull_request trigger, so pushes only
  # need testing once they land on main; this avoids running twice per push.
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Python the README promises, and a current one.
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: python -m unittest -v
